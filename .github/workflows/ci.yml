name: Node CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Validate JavaScript syntax
        run: npm run check

      # Boots the server and checks static serving plus API routing. Deliberately
      # does not call Reddit/GamerPower — that would make CI fail whenever a
      # third party has a bad day.
      - name: Start server and check routing
        run: |
          npm start &
          echo $! > server.pid
          for i in $(seq 1 20); do
            curl -sf http://localhost:8787/health >/dev/null && break
            sleep 1
          done
          fail() { echo "$1"; kill "$(cat server.pid)" || true; exit 1; }
          curl -sf http://localhost:8787/ >/dev/null || fail 'index.html not served at /'
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8787/api/nope)" = "404" ] \
            || fail 'API handler not mounted (expected 404 for unknown route)'
          kill "$(cat server.pid)"
