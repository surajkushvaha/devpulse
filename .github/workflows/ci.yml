name: Node CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm install

      - name: Start server and wait for readiness
        run: |
          npm start &
          echo $! > server.pid
          for i in {1..20}; do
            if curl -sf http://localhost:8787/devpulse.html >/dev/null; then
              break
            fi
            sleep 1
          done
          if ! curl -sf http://localhost:8787/devpulse.html >/dev/null; then
            echo 'Server failed to start or respond on http://localhost:8787/devpulse.html'
            kill "$(cat server.pid)" || true
            exit 1
          fi

      - name: Validate JavaScript syntax
        run: node --check devpulse-proxy.js
